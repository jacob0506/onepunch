<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.4" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 菱形外框 -->
  <rect x="25" y="25" width="78" height="78" rx="19" transform="rotate(45 64 64)" fill="url(#frame)"/>
  <rect x="30.5" y="30.5" width="67" height="67" rx="15" transform="rotate(45 64 64)" fill="#080d1c"/>
  <!-- 内圈星轨 -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="url(#frame)" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- 主星芒 -->
  <path d="M64 34 C68.8 57.4 70.6 59.2 94 64 C70.6 68.8 68.8 70.6 64 94 C59.2 70.6 57.4 68.8 34 64 C57.4 59.2 59.2 57.4 64 34 Z" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="6.5" fill="#080d1c"/>
  <circle cx="64" cy="64" r="3.6" fill="#fffbeb"/>
  <!-- 伴星 -->
  <path d="M97 30 C98.12 35.46 98.54 35.88 104 37 C98.54 38.12 98.12 38.54 97 44 C95.88 38.54 95.46 38.12 90 37 C95.46 35.88 95.88 35.46 97 30 Z" fill="#e0f2fe" opacity="0.9"/>
  <path d="M31 86 C31.8 89.9 32.1 90.2 36 91 C32.1 91.8 31.8 92.1 31 96 C30.2 92.1 29.9 91.8 26 91 C29.9 90.2 30.2 89.9 31 86 Z" fill="#fbcfe8" opacity="0.8"/>
</svg>